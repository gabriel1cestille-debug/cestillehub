<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preview dos ataques dos dragões</title>
<style>
:root{color-scheme:dark;--bg:#0a0d14;--card:#141a28;--line:#243049;--ink:#e9eef8;--mut:#8b97b0;--gold:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0 0 auto 0;height:58vh;background:#0a0d14}
#cv{width:100%;height:100%;display:block;touch-action:none}
#cap{position:absolute;left:12px;right:12px;top:10px;pointer-events:none;text-shadow:0 2px 8px #000}
#cap b{font-size:18px;display:block}#cap span{color:var(--mut);font-size:12px}
#bar{position:fixed;left:0;right:0;top:58vh;display:flex;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:#1d2740;border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:40px;cursor:pointer}
button.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
button.go{background:#2563eb;border-color:#2563eb;font-weight:700}
#list{position:fixed;left:0;right:0;top:calc(58vh + 58px);bottom:0;overflow:auto;padding:8px 12px 24px;-webkit-overflow-scrolling:touch}
h3{margin:12px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);min-height:36px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
#msg{position:fixed;left:12px;bottom:8px;font-size:11px;color:var(--mut);pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="cap"><b id="capT">Carregando…</b><span id="capS"></span></div></div>
<div id="bar">
  <button id="bN" class="on">Ataque normal</button>
  <button id="bS">Especial</button>
  <button id="bR" class="go">▶ Tocar de novo</button>
  <button id="bA">Tocar todos</button>
</div>
<div id="list"></div>
<div id="msg"></div>
<script src="assets/lib/three/build/three.min.js"></script>
<script src="assets/lib/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="assets/lib/three/examples/js/libs/meshopt_decoder.js"></script>
<script src="assets/colony/war_elemental_fx.js"></script>
<script src="assets/colony/war_elemental_catalog.js"></script>
<script src="assets/colony/war_elemental_attacks.js"></script>
<script src="assets/colony/war_elemental_epic.js"></script>
<script src="assets/colony/war_binbun_fx.js?v=8"></script>
<script src="assets/colony/war_signature_fx.js?v=5"></script>
<script>
(function () {
  'use strict';
  const T = THREE, cv = document.getElementById('cv');
  const R = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: false });
  R.outputEncoding = T.sRGBEncoding; R.setClearColor(0x0a0d14);
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(42, 1, .1, 200);
  scene.add(new T.HemisphereLight(0xcfe3ff, 0x2a3a28, 1.15));
  const sun = new T.DirectionalLight(0xffffff, .9); sun.position.set(-4, 9, 6); scene.add(sun);
  /* chão: faixa de jogo verde com grade, como na batalha */
  const ground = new T.Mesh(new T.PlaneGeometry(14, 5.2), new T.MeshLambertMaterial({ color: 0x3f6b3a })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const grid = new T.GridHelper(14, 14, 0x294a26, 0x294a26); grid.scale.z = .37; grid.position.y = .01; scene.add(grid);
  const from = new T.Vector3(-3.3, 1.15, 0), to = new T.Vector3(2.4, .95, 0);
  /* dragão de marcação (forma simples; os modelos 3D reais ficam no jogo) */
  const drag = new T.Group(); scene.add(drag);
  const dm = new T.MeshLambertMaterial({ color: 0xffffff });
  const body = new T.Mesh(new T.SphereGeometry(.55, 20, 14), dm); body.scale.set(1.25, .8, .8); body.position.y = .7; drag.add(body);
  const head = new T.Mesh(new T.SphereGeometry(.32, 16, 12), dm); head.position.set(.78, 1.1, 0); drag.add(head);
  const tail = new T.Mesh(new T.ConeGeometry(.2, 1, 10), dm); tail.rotation.z = Math.PI / 2; tail.position.set(-1.0, .6, 0); drag.add(tail);
  const wing = new T.Mesh(new T.ConeGeometry(.5, 1.1, 3), dm); wing.position.set(-.1, 1.25, .35); wing.rotation.set(.5, 0, 0); drag.add(wing);
  const wing2 = wing.clone(); wing2.position.z = -.35; wing2.rotation.x = -.5; drag.add(wing2);
  drag.position.set(-3.7, 0, 0);
  const ring = new T.Mesh(new T.RingGeometry(.85, 1, 40), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8, side: T.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.set(-3.7, .03, 0); scene.add(ring);
  /* alvos: três fantasmas roxos */
  const gm = new T.MeshLambertMaterial({ color: 0x5b2a9c });
  for (let i = 0; i < 3; i++) { const g = new T.Mesh(new T.CapsuleGeometry(.32, .5, 4, 10), gm); g.position.set(2.3 + (i % 2) * .5, .6, (i - 1) * .95); scene.add(g); }
  const fx = new window.ElementalFX(scene);
  /* modelos 3D reais de cada espécie (tabela gerada do código do jogo: arquivo, giro, escala, tom) */
  const MODELS = {"musgo":{"f":"dragons/cartoon.glb","yaw":1.5708,"fly":"^CharacterArmature\\|Flying_Idle$","idle":"Flying_Idle","flags":"i","tint":["#5fb842",0.9],"D":0.95,"glow":null,"base":"cartoon"},"argila":{"f":"dragons/cartoon.glb","yaw":1.5708,"fly":"^CharacterArmature\\|Flying_Idle$","idle":"Flying_Idle","flags":"i","tint":null,"D":0.85,"glow":null,"base":"cartoon"},"orvalho":{"f":"dragons/cartoon.glb","yaw":1.5708,"fly":"^CharacterArmature\\|Flying_Idle$","idle":"Flying_Idle","flags":"i","tint":["#5fc8ff",0.9],"D":0.85,"glow":null,"base":"cartoon"},"brisa":{"f":"dragons/bw.glb","yaw":-1.5708,"fly":"^fly$","idle":null,"flags":"i","tint":null,"D":0.85,"glow":null,"base":"bw"},"cascalho":{"f":"dragons/wyvern.glb","yaw":0,"fly":"^Flying","idle":"^Standing","flags":"i","tint":null,"D":0.95,"glow":null,"base":"wyvern"},"cinza":{"f":"dragons/nightmare.glb","yaw":0,"fly":"^flying$","idle":"^idle roosting","flags":"i","tint":null,"D":0.88,"glow":null,"base":"nightmare"},"floresta":{"f":"dragons/poison.glb","yaw":-1.5708,"fly":".","idle":null,"flags":"","tint":null,"D":1,"glow":null,"base":"poison"},"ambar":{"f":"dragons/fire2.glb","yaw":-1.5708,"fly":"fly","idle":null,"flags":"i","tint":["#ffb338",0.45],"D":1,"glow":null,"base":"fire2"},"mare":{"f":"dragons/ulyssan.glb","yaw":-1.5708,"fly":"fly_glide|fly","idle":"idle_calm|idle","flags":"i","tint":["#298aff",0.9],"D":1.05,"glow":"#4da6ff","base":"ulyssan"},"geada":{"f":"dragons/ulyssan.glb","yaw":-1.5708,"fly":"fly_glide|fly","idle":"idle_calm|idle","flags":"i","tint":null,"D":1,"glow":"#bce4ff","base":"ulyssan"},"bronze":{"f":"dragons/tilt.glb","yaw":1.5708,"fly":"Blade_Spin","idle":null,"flags":"i","tint":null,"D":1.08,"glow":null,"base":"tilt"},"prisma":{"f":"dragons/ulyssan.glb","yaw":-1.5708,"fly":"fly_glide|fly","idle":"idle_calm|idle","flags":"i","tint":["#5de8ff",0.9],"D":1.1,"glow":"#4de0ff","base":"ulyssan"},"esmeralda":{"f":"dragons/poison.glb","yaw":-1.5708,"fly":".","idle":null,"flags":"","tint":["#14e872",0.85],"D":1.1,"glow":"#28f585","base":"poison"},"solar":{"f":"dragons/fire2.glb","yaw":-1.5708,"fly":"fly","idle":null,"flags":"i","tint":["#ffd23a",0.55],"D":1.15,"glow":"#ffd64a","base":"fire2"},"sabio":{"f":"dragons/sage.glb","yaw":-1.5708,"fly":"Fly$","idle":"Idle$","flags":"i","tint":null,"D":1.1,"glow":null,"base":"sage"},"vulcao":{"f":"dragons/devil.glb","yaw":-1.5708,"fly":"^fly$","idle":null,"flags":"i","tint":["#ff4a1a",0.75],"D":1.3,"glow":"#ff7722","base":"devil"},"tempestade":{"f":"dragons/red.glb","yaw":-1.5708,"fly":"fly","idle":null,"flags":"i","tint":["#657dff",0.9],"D":1.3,"glow":"#7c92ff","base":"red"},"aurora":{"f":"dragons/red.glb","yaw":-1.5708,"fly":"fly","idle":null,"flags":"i","tint":["#ff75e6",0.9],"D":1.35,"glow":"#ffa1ec","base":"red"},"eclipse":{"f":"dragons/eternatus.glb","yaw":-1.5708,"fly":"eternatus_fly","idle":"eternatus_idle","flags":"i","tint":null,"D":1.55,"glow":"#ffcc44","base":"eternatus"},"morcego":{"f":"dragons/morcego.glb","yaw":1.5708,"fly":"Bat\\|Flying","idle":"Rest","flags":"i","tint":null,"D":1.05,"glow":"#b46bff","base":"morcego"},"chamas":{"f":"dragons/chamas.glb","yaw":0,"fly":"Flying","idle":null,"flags":"i","tint":null,"D":1.45,"glow":"#ff9a3c","base":"chamas"},"hamster":{"f":"dragons/hamster.glb","yaw":-1.5708,"fly":"Bat\\|Flying","idle":null,"flags":"i","tint":null,"D":1.4,"glow":"#c58bff","base":"hamster"},"vigia":{"f":"dragons/watcher.glb","yaw":1.5708,"fly":".","idle":null,"flags":"","tint":null,"D":1.5,"glow":"#8fd8ff","base":"watcher"},"guardiao_botanico":{"f":"dragons/guardiao_botanico.glb","yaw":0,"fly":"^Flying","idle":"^Standing","flags":"i","tint":null,"D":1.08,"glow":"#4ade80","base":"guardiao_botanico"},"sereia_glacial":{"f":"dragons/sereia_glacial.glb","yaw":-1.5708,"fly":"fly_glide|fly","idle":"idle_calm|idle","flags":"i","tint":null,"D":1.15,"glow":"#38bdf8","base":"sereia_glacial"},"morcego_noturno":{"f":"dragons/morcego_noturno.glb","yaw":1.5708,"fly":"Bat\\|Flying","idle":"Rest","flags":"i","tint":["#2a6df4",0.9],"D":1.3,"glow":"#38bdf8","base":"morcego_noturno"},"crono_engenheiro":{"f":"dragons/crono_engenheiro.glb","yaw":1.5708,"fly":"Flying","idle":"Flying","flags":"i","tint":null,"D":1.32,"glow":"#c084fc","base":"crono_engenheiro"},"demonio_cinzas":{"f":"dragons/demonio_cinzas.glb","yaw":1.5708,"fly":"^flying$","idle":"^idle$","flags":"i","tint":null,"D":1.55,"glow":"#ff6a1a","base":"demonio_cinzas"},"colosso_obsidiana":{"f":"dragons/colosso_obsidiana.glb","yaw":-1.5708,"fly":"^fly$","idle":null,"flags":"i","tint":null,"D":1.52,"glow":"#fb923c","base":"colosso_obsidiana"},"arquimago_astral":{"f":"dragons/arquimago_astral.glb","yaw":-1.5708,"fly":"eternatus_fly","idle":"eternatus_idle","flags":"i","tint":null,"D":1.55,"glow":"#fbbf24","base":"arquimago_astral"},"nimbo":{"f":"dragons/nimbo_autoral.glb","yaw":0,"fly":"^Flying_Idle$","idle":"^Flying_Idle$","flags":"i","tint":null,"D":1.18,"glow":"#84f6ff","base":"nimbo_autoral"}};
  const loader = new T.GLTFLoader(); if (window.MeshoptDecoder) loader.setMeshoptDecoder(window.MeshoptDecoder);
  const cache = {}, holder = new T.Group(); holder.position.set(-3.7, 0, 0); scene.add(holder);
  let mixer = null, tok = 0, curScene = null;
  window.PV = { holder, scene, cam, from, get cur() { return curScene; } };
  function loadFile(f) { return cache[f] || (cache[f] = new Promise((ok, no) => loader.load('assets/colony/' + f, g => { g.scene.traverse(o => { if (o.isMesh) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m && m.color && !m.userData.oc) m.userData.oc = m.color.clone(); }); } }); ok(g); }, undefined, no))); }
  function setModel(d) {
    const m = MODELS[d.id], my = ++tok; if (mixer) { mixer.stopAllAction(); mixer = null; }
    if (curScene) { holder.remove(curScene); curScene = null; }
    if (!m || !m.f) { drag.visible = true; return Promise.resolve(); }
    document.getElementById('msg').textContent = 'carregando modelo 3D…';
    return loadFile(m.f).then(g => {
      if (my !== tok) return; const sc = g.scene; sc.position.set(0, 0, 0); sc.scale.set(1, 1, 1); sc.rotation.set(0, 0, 0); holder.rotation.set(0, m.yaw || 0, 0); holder.updateMatrixWorld(true);
      const k = m.tint ? m.tint[1] : 0, tc = m.tint ? new T.Color(m.tint[0]) : null;
      sc.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(mt => { if (mt && mt.userData.oc) { mt.color.copy(mt.userData.oc); if (tc) mt.color.lerp(tc, k * .85); } }); });
      sc.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
      holder.add(sc); curScene = sc;
      const clips = g.animations || [], re = n => (n ? new RegExp(n, m.flags || 'i') : null), cf = clips.find(c2 => re(m.fly) && re(m.fly).test(c2.name)) || clips.find(c2 => re(m.idle) && re(m.idle).test(c2.name)) || clips[0];
      if (cf) { mixer = new T.AnimationMixer(sc); mixer.clipAction(cf).play(); mixer.update(0); }
      /* caixa do dragão já posado: vértices com esqueleto aplicado (a caixa padrão ignora o esqueleto e erra o tamanho) */
      const wbox = () => { sc.updateMatrixWorld(true); const b = new T.Box3(), v = new T.Vector3(); sc.traverse(o => { if (!o.isMesh) return; if (o.isSkinnedMesh) { o.skeleton.update(); const pa = o.geometry.attributes.position, st = Math.max(1, Math.floor(pa.count / 1800)); for (let q = 0; q < pa.count; q += st) { v.fromBufferAttribute(pa, q); o.boneTransform(q, v); v.applyMatrix4(o.matrixWorld); b.expandByPoint(v); } } else b.expandByObject(o); }); return b; };
      holder.rotation.y = m.yaw || 0; sc.scale.set(1, 1, 1); sc.position.set(0, 0, 0);
      let box = wbox(); const sz = box.getSize(new T.Vector3()); const s = (2.5 * (m.D || 1)) / Math.max(sz.x, sz.z, sz.y * 1.3, .001); sc.scale.setScalar(s);
      const fit = () => { sc.position.set(0, 0, 0); const bx = wbox(), c = bx.getCenter(new T.Vector3()); sc.position.set(-(c.x - holder.position.x), .25 - bx.min.y, -(c.z - holder.position.z)); return wbox(); };
      box = fit();
      /* a cabeça tem de apontar para +x (lado dos alvos): usa o osso da cabeça quando existe */
      let head = null; sc.traverse(o => { if (!head && o.isBone && /head/i.test(o.name)) head = o; });
      if (head) { const hp = head.getWorldPosition(new T.Vector3()), cx = (box.min.x + box.max.x) / 2; if (hp.x < cx) { holder.rotation.y += Math.PI; box = fit(); } }
      drag.visible = false; PV.last = { head: !!head, rot: +holder.rotation.y.toFixed(2) };
      from.set(box.max.x - (box.max.x - box.min.x) * .08, box.min.y + (box.max.y - box.min.y) * .7, 0);
      document.getElementById('msg').textContent = 'Efeitos reais e modelos 3D do jogo';
    }).catch(e => { drag.visible = true; document.getElementById('msg').textContent = 'modelo não carregou: ' + (e && e.message || e); });
  }
  let sel = null, special = false, auto = null;

  function size() { const w = cv.clientWidth, h = cv.clientHeight; R.setSize(w, h, false); R.setPixelRatio(Math.min(2, devicePixelRatio || 1)); cam.aspect = w / h; const wide = w / h; cam.position.set(-.1, 9.6 + (wide < 1.2 ? 3 : 0), 10 + (wide < 1.2 ? 3.2 : 0)); cam.lookAt(-.1, .5, 0); cam.updateProjectionMatrix(); }
  addEventListener('resize', size);

  function play() {
    if (!sel) return; fx.clear();
    const actor = { data: sel, muzzle: () => from.clone() };
    try {
      if (sel.id === 'nimbo' && !special) { window.PreviewDozeAtaques.decorate(fx, actor, to, false); fx.attack(actor, to, false); }
      else if (window.PreviewDozeAtaques.ids.has(sel.id)) { window.PreviewDozeAtaques.decorate(fx, actor, to, special); fx.attack(actor, to, special); }
      else window.PreviewPackAttacks.fire(fx, actor, to, special);
    } catch (e) { document.getElementById('msg').textContent = 'erro: ' + e.message; console.warn(e); }
  }
  function show(d, sp, doPlay = true) {
    sel = d; special = sp; const c = new T.Color(d.colors[0]);
    dm.color.copy(c); ring.material.color.copy(c);
    document.getElementById('capT').textContent = d.name + ' · ' + (sp ? 'Especial: ' + d.moves[1] : 'Normal: ' + d.moves[0]);
    document.getElementById('capS').textContent = (d.descriptions && d.descriptions[sp ? 1 : 0]) || '';
    document.getElementById('bN').classList.toggle('on', !sp); document.getElementById('bS').classList.toggle('on', sp);
    document.querySelectorAll('.chip').forEach(el => el.classList.toggle('sel', el.dataset.id === d.id));
    if (doPlay) setModel(d).then(play); else setModel(d);
  }
  const RK = ['Comum', 'Incomum', 'Raro', 'Épico', 'Lendário'], list = document.getElementById('list');
  const cat = window.ElementalCatalog.slice().sort((a, b) => b.rarity - a.rarity || a.name.localeCompare(b.name));
  for (let r = 4; r >= 0; r--) {
    const g = cat.filter(x => x.rarity === r); if (!g.length) continue;
    const h = document.createElement('h3'); h.textContent = RK[r]; list.appendChild(h);
    const w = document.createElement('div'); w.className = 'chips'; list.appendChild(w);
    g.forEach(d => { const b = document.createElement('button'); b.className = 'chip'; b.dataset.id = d.id; b.innerHTML = '<i style="background:' + d.colors[0] + '"></i>' + d.name.replace(/^Dragão (d[aeo]s? )?/, ''); b.onclick = () => { stopAuto(); show(d, special); }; w.appendChild(b); });
  }
  document.getElementById('bN').onclick = () => { stopAuto(); if (sel) show(sel, false); };
  document.getElementById('bS').onclick = () => { stopAuto(); if (sel) show(sel, true); };
  document.getElementById('bR').onclick = () => { if (sel) play(); };
  function stopAuto() { if (auto) { clearInterval(auto); auto = null; document.getElementById('bA').textContent = 'Tocar todos'; document.getElementById('bA').classList.remove('on'); } }
  document.getElementById('bA').onclick = () => {
    if (auto) { stopAuto(); return; }
    const seq = []; cat.forEach(d => { seq.push([d, false]); seq.push([d, true]); }); let i = 0;
    const step = () => { const [d, sp] = seq[i++ % seq.length]; show(d, sp); const chip = document.querySelector('.chip.sel'); if (chip) chip.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
    document.getElementById('bA').textContent = '■ Parar'; document.getElementById('bA').classList.add('on'); step(); auto = setInterval(step, 3300);
  };
  const clock = new T.Clock();
  (function loop() { requestAnimationFrame(loop); const dt = Math.min(.05, clock.getDelta()); fx.update(dt); if (mixer) mixer.update(dt); R.render(scene, cam); })();
  size(); setTimeout(size, 300);
  show(cat.find(d => d.id === 'eclipse') || cat[0], false);
  
})();
</script>
</body>
</html>
